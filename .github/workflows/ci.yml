name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/planner
          AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
          INVITE_CODE: testcode
      # The routine that runs on the user's computer: ledger and audit, standard library only.
      - run: python3 -m unittest discover -s routine/tests -v
      - run: bash -n routine/bin/run.sh && bash -n routine/install.sh

# Deploys: Vercel's Git integration builds every push to main into production and every
# pull request into a preview URL (Project > Settings > Git). This workflow is the gate:
# a failing test shows as a red check on the commit and the pull request.
